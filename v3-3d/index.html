<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>荒野生存 3D</title>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="damage-flash"></div>
  <div id="low-health-vignette"></div>
  <div id="world-labels"></div>
  <div id="float-layer"></div>

  <header id="hud" class="hud hidden">
    <div class="hud-left">
      <div class="stat-bar" data-stat="health">
        <label>❤️ 生命</label>
        <div class="bar-track"><div id="bar-health" class="bar-fill"></div></div>
        <span id="val-health" class="val">100</span>
      </div>
      <div class="stat-bar" data-stat="hunger">
        <label>🍖 饥饿</label>
        <div class="bar-track"><div id="bar-hunger" class="bar-fill"></div></div>
        <span id="val-hunger" class="val">100</span>
      </div>
      <div class="stat-bar" data-stat="thirst">
        <label>💧 口渴</label>
        <div class="bar-track"><div id="bar-thirst" class="bar-fill"></div></div>
        <span id="val-thirst" class="val">100</span>
      </div>
      <div class="stat-bar" data-stat="stamina">
        <label>⚡ 体力</label>
        <div class="bar-track"><div id="bar-stamina" class="bar-fill stamina"></div></div>
        <span id="val-stamina" class="val">100</span>
      </div>
    </div>

    <div class="hud-right">
      <div class="meta">
        <span id="h-day">第 1 天</span>
        <span id="h-time">☀️ 白天</span>
        <span class="score">⭐ <b id="val-score">0</b></span>
      </div>
      <div class="day-cycle">
        <div id="day-progress" class="day-fill"></div>
      </div>
      <div id="compass" title="方向（相对北）">
        <div id="compass-arrow">▲</div>
        <span class="compass-n">N</span>
      </div>
      <a class="back" href="../">← 返回</a>
      <span id="fps-counter" title="帧率">-- FPS</span>
    </div>
  </header>

  <div id="spawn-shield"></div>
  <div id="crosshair" aria-hidden="true"><span></span></div>
  <div id="interact-prompt"></div>
  <div id="interact-progress-wrap"><div id="interact-progress"></div></div>

  <footer id="hud-bottom" class="hud hidden">
    <div id="equip-slots" class="equip-slots"></div>
    <div id="inventory-bar"></div>
    <div id="hint">点击画面开始</div>
  </footer>

  <div id="toast"></div>

  <div id="overlay-start" class="overlay show">
    <div class="panel">
      <h1>荒野生存 3D</h1>
      <p class="lead">第三人称荒野生存 · 采集、狩猎、抵御黑夜</p>
      <div class="controls-grid">
        <div><kbd>W A S D</kbd><span>移动（相对视角）</span></div>
        <div><kbd>Shift</kbd><span>奔跑（需移动中）</span></div>
        <div><kbd>空格</kbd><span>跳跃</span></div>
        <div><kbd>鼠标</kbd><span>转动视角</span></div>
        <div><kbd>左键</kbd><span>攻击敌人 / 狩猎</span></div>
        <div><kbd>E</kbd> / <kbd>F</kbd><span>采集 / 捕获 / 食用</span></div>
        <div><kbd>C</kbd><span>快速烤肉</span></div>
        <div><kbd>B</kbd><span>制作 / 建造 / 装备</span></div>
        <div><kbd>Esc</kbd><span>暂停菜单</span></div>
        <div><kbd>Tab</kbd><span>显示/隐藏背包栏</span></div>
      </div>
      <button id="btn-start" type="button">开始生存</button>
    </div>
  </div>

  <div id="overlay-pause" class="overlay">
    <div class="panel">
      <h2>已暂停</h2>
      <div class="setting">
        <label>鼠标灵敏度 X <output id="sens-val-x"></output></label>
        <input id="sens-x" type="range" min="0.001" max="0.006" step="0.0002" />
      </div>
      <div class="setting">
        <label>鼠标灵敏度 Y <output id="sens-val-y"></output></label>
        <input id="sens-y" type="range" min="0.001" max="0.006" step="0.0002" />
      </div>
      <div class="pause-actions">
        <button id="btn-resume" type="button">继续游戏</button>
        <button id="btn-pause-restart" type="button" class="secondary">重新开始</button>
      </div>
    </div>
  </div>

  <div id="overlay-craft" class="overlay">
    <div class="panel panel-wide">
      <h2>🔨 制作 & 建造</h2>
      <p class="lead">消耗材料制作装备、道具，或进入放置模式建造</p>
      <div id="craft-list" class="craft-list"></div>
      <button id="btn-craft-close" type="button">关闭 (B)</button>
    </div>
  </div>

  <div id="overlay-dead" class="overlay">
    <div class="panel">
      <h2>生存失败</h2>
      <p>你存活了 <strong id="dead-day">0</strong> 天，得分 <strong id="dead-score">0</strong></p>
      <button id="btn-restart" type="button">再次挑战</button>
      <a class="link-back" href="../">返回版本选择</a>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=20250527d"></script>
</body>
</html>
